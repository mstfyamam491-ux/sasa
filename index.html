<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haneen - حنين</title>
    <!-- استيراد خط عربي أنيق للأزرار والنصوص الجانبية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- استيراد مكتبة Tailwind CSS للتنسيق السريع والمتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* إعدادات الصفحة الأساسية والخلفية المتدرجة الدافئة */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #2d0b1e 0%, #16040e 60%, #090105 100%);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* لوحة الرسم الخاصة بالقلوب والجزيئات اللامعة */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* حاوية الاسم والرسوم المتجهة */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 1rem;
        }

        /* تأثير التوهج الخلفي الناعم خلف الاسم */
        .ambient-glow {
            position: absolute;
            width: 60vw;
            max-width: 500px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(255, 77, 136, 0.25) 0%, rgba(255, 77, 136, 0) 70%);
            filter: blur(25px);
            z-index: -1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* تنسيق مسارات الرسم اليدوي لاسم Haneen */
        .letter-path {
            fill: none;
            stroke: url(#romanticGradient);
            stroke-width: 6.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.8)) drop-shadow(0 0 18px rgba(255, 20, 147, 0.5));
        }

        /* القلب الصغير المرسوم مع الاسم */
        .flourish-heart {
            fill: rgba(255, 77, 136, 0);
            stroke: #ff4d88;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 10px rgba(255, 77, 136, 0.9));
            transition: fill 0.8s ease;
        }

        .flourish-heart.filled {
            fill: rgba(255, 77, 136, 0.85);
        }

        /* حركة نبض خفيفة للبطاقة بعد اكتمال الكتابة */
        .floating-name {
            animation: floatName 3.5s ease-in-out infinite;
        }

        @keyframes floatName {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* تصميم زر إعادة التشغيل بتأثير زجاجي متوهج */
        .replay-btn {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 133, 179, 0.35);
            box-shadow: 0 4px 20px rgba(255, 42, 112, 0.25), inset 0 0 12px rgba(255, 133, 179, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .replay-btn:hover {
            background: rgba(255, 77, 136, 0.2);
            border-color: rgba(255, 133, 179, 0.8);
            box-shadow: 0 6px 28px rgba(255, 42, 112, 0.5), inset 0 0 15px rgba(255, 133, 179, 0.3);
            transform: translateY(-2px) scale(1.03);
        }

        .replay-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* دوران أيقونة الإعادة */
        .spin-icon {
            animation: spinOnce 0.6s ease-in-out;
        }

        @keyframes spinOnce {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>

    <!-- لوحة الكانفاس التفاعلية للقلوب والجزيئات اللامعة -->
    <canvas id="particle-canvas"></canvas>

    <!-- المحتوى الرئيسي -->
    <div class="content-wrapper">
        <div class="ambient-glow"></div>

        <!-- حاوية الرسم المتجه لاسم Haneen بخط يدوي متصل -->
        <div id="name-container" class="w-full max-w-2xl px-2 floating-name cursor-pointer">
            <svg id="signature-svg" viewBox="0 0 760 230" class="w-full h-auto overflow-visible">
                <defs>
                    <!-- تدرج لوني رومانسي ذهبي ووردي للخط -->
                    <linearGradient id="romanticGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff85b3" />
                        <stop offset="35%" stop-color="#ff2a70" />
                        <stop offset="70%" stop-color="#ffb3c6" />
                        <stop offset="100%" stop-color="#ffd166" />
                    </linearGradient>
                </defs>

                <!-- حرف H (العمود الأيسر + العمود الأيمن + العارضة المائلة المتصلة بحرف a) -->
                <path class="letter-path" data-duration="550" d="M 85 45 C 82 95, 72 145, 65 180" />
                <path class="letter-path" data-duration="550" d="M 145 40 C 140 90, 130 145, 123 180" />
                <path class="letter-path" data-duration="450" d="M 55 118 C 95 112, 135 106, 172 112" />

                <!-- حرف a (متصل بانسيابية) -->
                <path class="letter-path" data-duration="650" d="M 225 118 C 205 102, 172 115, 170 145 C 168 172, 195 180, 218 158 C 226 148, 232 128, 234 115 C 230 142, 228 168, 244 172 C 254 174, 265 162, 274 148" />

                <!-- حرف n -->
                <path class="letter-path" data-duration="600" d="M 274 148 C 280 132, 286 115, 290 112 C 287 132, 283 155, 280 172 C 288 145, 308 112, 326 114 C 340 116, 336 148, 334 166 C 333 175, 344 175, 358 160" />

                <!-- حرف e الأولى -->
                <path class="letter-path" data-duration="550" d="M 358 160 C 378 156, 404 142, 405 124 C 406 110, 386 108, 374 124 C 362 142, 368 172, 394 173 C 410 173, 424 162, 434 152" />

                <!-- حرف e الثانية -->
                <path class="letter-path" data-duration="550" d="M 434 152 C 454 148, 480 134, 481 116 C 482 102, 462 100, 450 116 C 438 134, 444 164, 470 165 C 486 165, 500 154, 512 142" />

                <!-- حرف n الأخيرة مع ذيل زخرفي -->
                <path class="letter-path" data-duration="750" d="M 512 142 C 518 126, 524 112, 528 108 C 525 128, 521 150, 518 168 C 526 140, 546 108, 564 110 C 578 112, 574 145, 572 164 C 571 178, 592 178, 622 152 C 638 138, 650 122, 662 108" />

                <!-- قلب زخرفي صغير يُرسم في نهاية الاسم -->
                <path id="end-heart" class="flourish-heart" data-duration="650" d="M 678 96 C 678 82, 696 78, 700 92 C 704 78, 722 82, 722 96 C 722 112, 700 125, 700 125 C 700 125, 678 112, 678 96 Z" />
            </svg>
        </div>

        <!-- زر إعادة تشغيل حركة الكتابة -->
        <button id="replay-button" class="replay-btn mt-8 text-pink-100 px-6 py-3 rounded-full flex items-center gap-3 text-sm sm:text-base font-semibold cursor-pointer focus:outline-none">
            <svg id="replay-icon" class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>إعادة الكتابة</span>
        </button>
    </div>

    <script>
        /**
         * تهيئة نظام الرسوم المتحركة لكتابة الاسم والقلوب الطائرة
         */
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            const svg = document.getElementById('signature-svg');
            const paths = Array.from(svg.querySelectorAll('path'));
            const endHeart = document.getElementById('end-heart');
            const replayBtn = document.getElementById('replay-button');
            const replayIcon = document.getElementById('replay-icon');

            let width, height;
            let hearts = [];
            let sparkles = [];
            let animationCancelToken = 0;

            // لوحة ألوان رومانسية دافئة للقلوب والجزيئات
            const heartColors = [
                '#ff2a70', '#ff4d88', '#ff75a0', '#ff9ebb',
                '#ffb3c6', '#e01e5a', '#ff0a54', '#ffd166'
            ];

            // ضبط أبعاد الكانفاس لتتناسب مع حجم الشاشة
            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            /**
             * فئة تمثل قلباً طائراً بتأثيرات فيزيائية ناعمة
             */
            class Heart {
                constructor(x, y, isBurst = false) {
                    this.x = x ?? Math.random() * width;
                    this.y = y ?? height + 30;
                    this.size = isBurst ? (Math.random() * 14 + 8) : (Math.random() * 16 + 8);
                    this.color = heartColors[Math.floor(Math.random() * heartColors.length)];
                    
                    if (isBurst) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 4 + 1.5;
                        this.vx = Math.cos(angle) * speed;
                        this.vy = Math.sin(angle) * speed - 1.5;
                        this.decay = Math.random() * 0.015 + 0.012;
                    } else {
                        this.vx = (Math.random() - 0.5) * 0.8;
                        this.vy = -(Math.random() * 1.4 + 0.6);
                        this.decay = 0.002;
                    }

                    this.alpha = isBurst ? 1 : (Math.random() * 0.6 + 0.3);
                    this.wobble = Math.random() * Math.PI * 2;
                    this.wobbleSpeed = Math.random() * 0.04 + 0.01;
                    this.rotation = (Math.random() - 0.5) * 0.5;
                    this.isBurst = isBurst;
                }

                update() {
                    this.wobble += this.wobbleSpeed;
                    this.x += this.vx + Math.sin(this.wobble) * (this.isBurst ? 0.3 : 0.6);
                    this.y += this.vy;

                    if (this.isBurst) {
                        this.vx *= 0.97;
                        this.vy *= 0.97;
                        this.vy -= 0.03; // طفو خفيف للأعلى
                        this.alpha -= this.decay;
                    } else {
                        if (this.y < height * 0.15) {
                            this.alpha -= 0.006;
                        }
                    }
                }

                draw(context) {
                    if (this.alpha <= 0) return;
                    context.save();
                    context.translate(this.x, this.y);
                    context.rotate(this.rotation + Math.sin(this.wobble) * 0.15);
                    context.globalAlpha = Math.max(0, this.alpha);

                    // توهج ناعم للقلب
                    context.shadowBlur = 12;
                    context.shadowColor = this.color;
                    context.fillStyle = this.color;

                    // رسم شكل القلب باستخدام منحنيات بيزيه
                    const s = this.size / 15;
                    context.beginPath();
                    context.moveTo(0, 5 * s);
                    context.bezierCurveTo(0, 2 * s, -7 * s, -5 * s, -12 * s, 2 * s);
                    context.bezierCurveTo(-17 * s, 9 * s, -7 * s, 17 * s, 0, 22 * s);
                    context.bezierCurveTo(7 * s, 17 * s, 17 * s, 9 * s, 12 * s, 2 * s);
                    context.bezierCurveTo(7 * s, -5 * s, 0, 2 * s, 0, 5 * s);
                    context.fill();

                    context.restore();
                }
            }

            /**
             * فئة تمثل جزيئات لامعة (Sparkles) متلألئة في الخلفية أو تتبع رأس القلم
             */
            class Sparkle {
                constructor(x, y, isPenTip = false) {
                    this.x = x ?? Math.random() * width;
                    this.y = y ?? Math.random() * height;
                    this.size = isPenTip ? (Math.random() * 3.5 + 1.5) : (Math.random() * 2.5 + 0.8);
                    this.vx = isPenTip ? (Math.random() - 0.5) * 2.5 : (Math.random() - 0.5) * 0.2;
                    this.vy = isPenTip ? (Math.random() - 0.5) * 2.5 + 0.5 : (Math.random() - 0.5) * 0.2;
                    this.alpha = Math.random();
                    this.alphaSpeed = isPenTip ? -(Math.random() * 0.03 + 0.02) : (Math.random() * 0.02 + 0.008);
                    this.isPenTip = isPenTip;
                    this.color = Math.random() > 0.3 ? '#ffd166' : '#ffffff';
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.isPenTip) {
                        this.alpha += this.alphaSpeed;
                    } else {
                        this.alpha += this.alphaSpeed;
                        if (this.alpha >= 1 || this.alpha <= 0.1) {
                            this.alphaSpeed = -this.alphaSpeed;
                        }
                    }
                }

                draw(context) {
                    if (this.alpha <= 0) return;
                    context.save();
                    context.translate(this.x, this.y);
                    context.globalAlpha = Math.max(0, Math.min(1, this.alpha));
                    context.fillStyle = this.color;
                    context.shadowBlur = 10;
                    context.shadowColor = '#ffd166';

                    // رسم نجمة رباعية لامعة
                    const r = this.size;
                    context.beginPath();
                    context.moveTo(0, -r * 2);
                    context.quadraticCurveTo(0, 0, r * 2, 0);
                    context.quadraticCurveTo(0, 0, 0, r * 2);
                    context.quadraticCurveTo(0, 0, -r * 2, 0);
                    context.quadraticCurveTo(0, 0, 0, -r * 2);
                    context.fill();

                    context.restore();
                }
            }

            // إنشاء النجوم اللامعة الثابتة في الخلفية
            function initBackgroundSparkles() {
                sparkles = [];
                const count = Math.min(65, Math.floor((width * height) / 18000));
                for (let i = 0; i < count; i++) {
                    sparkles.push(new Sparkle());
                }
            }
            initBackgroundSparkles();

            /**
             * تحويل إحداثيات نقطة داخل الـ SVG إلى إحداثيات الشاشة الحقيقية
             * لإطلاق جزيئات لامعة من رأس القلم أثناء الكتابة
             */
            function emitPenSparkles(pathElement, lengthAtPoint) {
                try {
                    const pt = pathElement.getPointAtLength(lengthAtPoint);
                    const svgRect = svg.getBoundingClientRect();
                    const viewBox = svg.viewBox.baseVal;
                    
                    const scaleX = svgRect.width / viewBox.width;
                    const scaleY = svgRect.height / viewBox.height;
                    
                    const screenX = svgRect.left + pt.x * scaleX;
                    const screenY = svgRect.top + pt.y * scaleY;

                    for (let i = 0; i < 2; i++) {
                        sparkles.push(new Sparkle(screenX, screenY, true));
                    }
                    if (Math.random() < 0.25) {
                        hearts.push(new Heart(screenX, screenY, true));
                    }
                } catch (e) {
                    // تجاهل أي أخطاء طفيفة أثناء تغيير حجم النافذة
                }
            }

            /**
             * تحريك مسار واحد بشكل تدريجي يحاكي الكتابة اليدوية
             */
            function animateSinglePath(path, duration, token) {
                return new Promise((resolve) => {
                    const length = path.getTotalLength();
                    path.style.strokeDasharray = length;
                    path.style.strokeDashoffset = length;
                    path.style.opacity = '1';

                    let startTime = null;

                    function step(timestamp) {
                        if (token !== animationCancelToken) return;
                        if (!startTime) startTime = timestamp;
                        const elapsed = timestamp - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        // دالة تسارع ناعمة للكتابة
                        const easeProgress = progress < 0.5
                            ? 2 * progress * progress
                            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                        const currentOffset = length * (1 - easeProgress);
                        path.style.strokeDashoffset = currentOffset;

                        // إطلاق شرارات لامعة من طرف القلم أثناء الحركة
                        if (progress < 1) {
                            emitPenSparkles(path, length * easeProgress);
                            requestAnimationFrame(step);
                        } else {
                            path.style.strokeDashoffset = 0;
                            resolve();
                        }
                    }

                    requestAnimationFrame(step);
                });
            }

            /**
             * تشغيل تسلسل كتابة اسم "Haneen" بالكامل
             */
            async function playHandwritingAnimation() {
                animationCancelToken++;
                const currentToken = animationCancelToken;

                // إعادة ضبط جميع المسارات للإخفاء قبل البدء
                endHeart.classList.remove('filled');

                paths.forEach((path) => {
                    const length = path.getTotalLength();
                    path.style.strokeDasharray = length;
                    path.style.strokeDashoffset = length;
                    path.style.opacity = '0';
                });

                // انتظار بسيط لتهيئة العرض
                await new Promise(r => setTimeout(r, 250));
                if (currentToken !== animationCancelToken) return;

                // رسم كل مسار بالتتابع
                for (let i = 0; i < paths.length; i++) {
                    if (currentToken !== animationCancelToken) return;
                    const path = paths[i];
                    const duration = parseInt(path.getAttribute('data-duration') || '600', 10);
                    await animateSinglePath(path, duration, currentToken);
                }

                if (currentToken !== animationCancelToken) return;

                // تعبئة القلب الصغير في نهاية الاسم وإطلاق احتفالية قلوب خفيفة
                endHeart.classList.add('filled');

                const svgRect = svg.getBoundingClientRect();
                for (let i = 0; i < 14; i++) {
                    setTimeout(() => {
                        if (currentToken !== animationCancelToken) return;
                        const rx = svgRect.left + Math.random() * svgRect.width;
                        const ry = svgRect.top + Math.random() * svgRect.height;
                        hearts.push(new Heart(rx, ry, true));
                    }, i * 60);
                }
            }

            /**
             * حلقة الرسوم المتحركة الرئيسية للكانفاس
             */
            function renderLoop() {
                ctx.clearRect(0, 0, width, height);

                // إضافة قلوب صاعدة بشكل تلقائي مستمر
                if (hearts.length < 35 && Math.random() < 0.06) {
                    hearts.push(new Heart());
                }

                // تحديث ورسم الجزيئات اللامعة
                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const s = sparkles[i];
                    s.update();
                    s.draw(ctx);
                    if (s.isPenTip && s.alpha <= 0) {
                        sparkles.splice(i, 1);
                    }
                }

                // تحديث ورسم القلوب الطائرة
                for (let i = hearts.length - 1; i >= 0; i--) {
                    const h = hearts[i];
                    h.update();
                    h.draw(ctx);
                    if (h.alpha <= 0 || h.y < -50) {
                        hearts.splice(i, 1);
                    }
                }

                requestAnimationFrame(renderLoop);
            }

            /**
             * التفاعل عند تحريك الماوس أو اللمس (نثر قلوب وجزيئات تتبع المؤشر)
             */
            let lastSpawnTime = 0;
            function handlePointerMove(x, y) {
                const now = Date.now();
                if (now - lastSpawnTime > 45) {
                    hearts.push(new Heart(x, y, true));
                    if (Math.random() > 0.4) {
                        sparkles.push(new Sparkle(x, y, true));
                    }
                    lastSpawnTime = now;
                }
            }

            // إطلاق انفجار من القلوب عند النقر في أي مكان
            function handlePointerClick(x, y) {
                for (let i = 0; i < 12; i++) {
                    hearts.push(new Heart(x, y, true));
                }
                for (let i = 0; i < 8; i++) {
                    sparkles.push(new Sparkle(x, y, true));
                }
            }

            window.addEventListener('mousemove', (e) => {
                handlePointerMove(e.clientX, e.clientY);
            });

            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('#replay-button')) return;
                handlePointerClick(e.clientX, e.clientY);
            });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('#replay-button')) return;
                if (e.touches.length > 0) {
                    handlePointerClick(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            // تفاعل زر إعادة التشغيل
            replayBtn.addEventListener('click', () => {
                replayIcon.classList.remove('spin-icon');
                void replayIcon.offsetWidth; // إعادة تفعيل الأنيميشن
                replayIcon.classList.add('spin-icon');
                playHandwritingAnimation();
            });

            // بدء التشغيل عند تحميل الصفحة
            renderLoop();
            playHandwritingAnimation();
        });
    </script>
</body>
</html>
